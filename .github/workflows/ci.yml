name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The cross-architecture tests skip without these, and a suite that
      # skips its main case proves nothing.
      - name: Toolchains
        run: sudo apt-get update && sudo apt-get install -y gcc gcc-aarch64-linux-gnu qemu-user-static
      - run: pip install -e ".[dev]"
      - run: pytest -q -rs
